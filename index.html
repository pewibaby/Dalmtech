<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
<header id="encabezado">
   <div class="logotipo"><img src="logo.png" alt="logotipo">
       <h1>DalmTech</h1>
    </div>
   
</header>
 <main>
  <h1>Iniciar Sesión</h1>


  <form>

    <!-- Campo de usuario / correo -->
    <div class="usuario1">
      <label for="usuario">Usuario o correo:</label>
      <input type="text" id="usuario" placeholder="Ej: usuario@email.com">
    </div>

    <br>
    <!-- Campo de contraseña -->
    <div class="contra">
      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" placeholder="Ingresa tu clave"> 
    <button type="button" id="ojito" aria-label="Mostrar contraseña">
  <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </svg>
</button>
      <p>¿No tienes cuenta? <a href="#">Registrate aqui</a></p>
    </div>

    <br>

    <!-- Opciones adicionales -->
    <div>
      <input type="checkbox" id="recordar">
      <label for="recordar">Recordarme</label>
       <a href="#">olvide mi contraseña</a>
    </div>

    <br>

    <!-- Botón para enviar -->
    <button type="submit">Ingresar</button>

  </form>
</main> 
</body>
<footer>

  <p>
    <a href="#">Términos y Condiciones</a> 
    <a href="#">Política de Privacidad</a>
  </p>
</footer>
</html>
